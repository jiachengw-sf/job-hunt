# Fit-engine eval set (seed).
#
# 40 synthetic postings across four role families (postings.yaml), plus 168 ranking cases
# (postings_ranking.yaml: title-only rows, watchlist jobs, undated jobs, a deadline, and bulk
# title-only rows like the long Simplify lists), each graded
# for all four test personas. Personas' own watchlist.yaml files are loaded.
#   grade 0 = not a fit or ineligible, 1 = plausible, 2 = strong fit
#   band    = the band a careful reviewer would assign (strong | good | stretch | not_a_fit)
#   gated   = true when a Must preference, knockout requirement or dealbreaker rules it out
#   requirements = per-requirement met / partial / unmet, keyed by a quote from the posting
#
# LIMITATION: one annotator wrote these labels. The build spec calls for real public postings,
# 30-60 per role family, each graded by two people. Treat these numbers as a regression check,
# not as evidence of accuracy, until that set exists.
version: 1
today: 2026-10-18
personas_dir: ../../tests/personas
postings: [postings.yaml, postings_ranking.yaml]
labels: [labels.yaml, labels_ranking.yaml]
# Ranking checks: in each pair, the first job must rank above the second.
must_rank_above:
  first-year-intern:
    - [r02, r01]   # a watchlist internship above a fresh sales job at the same company
    - [r08, r09]   # same match; the internship with an application deadline first
  intl-sponsorship:
    - [r02, r01]
  newgrad-analyst:
    - [r03, r04]   # undated, untexted jobs at one watchlist company still separate by role
    - [r03, r07]
    - [r05, r06]
    - [r05, r07]   # tied on the old priority (0.338); only the job id kept them apart
annotators: 1
