[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jobhunt"
dynamic = ["version"]
description = "A local-first job-hunt agent: deterministic Python core plus portable Agent Skills. The human always clicks Submit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "jobhunt contributors" }]
keywords = ["job search", "job hunt", "agent skills", "claude code", "codex", "greenhouse", "lever", "ashby"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
dependencies = [
  "click>=8.1",
  "openpyxl>=3.1.5",
  "pydantic>=2.7",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/jiachengw-sf/jobhunt"
Issues = "https://github.com/jiachengw-sf/jobhunt/issues"
Changelog = "https://github.com/jiachengw-sf/jobhunt/blob/main/PROGRESS.md"

[project.optional-dependencies]
# Reads Ashby application forms (Milestone 3) and pre-fills (Milestone 4). `jobhunt doctor` reports when it is missing.
browser = ["playwright>=1.45"]
# Embedding recall (sentence-transformers pulls in PyTorch, ~1-2 GB). Without it recall is BM25 only.
recall = ["sentence-transformers>=3.0"]
# Google Sheets tracker. XLSX needs nothing extra.
sheets = ["gspread>=6.0", "google-auth>=2.0"]

[project.scripts]
jobhunt = "jobhunt.cli.main:main"

[dependency-groups]
dev = [
    "gspread>=6.2.1",
    "playwright>=1.45",
    "pytest>=8",
    "ruff>=0.6",
]

# One version, in src/jobhunt/__init__.py.
[tool.hatch.version]
path = "src/jobhunt/__init__.py"

# The demo GIF is for the README on GitHub; keep it out of the source distribution.
[tool.hatch.build.targets.sdist]
exclude = ["docs/demo.gif"]

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

# The skills ship inside the package so `jobhunt skills install` works from a plain install.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "jobhunt/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLW1514"]
# PLW1514 (open/read_text/write_text without encoding) is a preview rule: Windows defaults to
# cp1252, so every text read and write names its encoding. Only explicitly selected preview
# rules are enabled.
preview = true
explicit-preview-rules = true
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]  # en dashes and curly quotes are matched on purpose


[tool.ruff.lint.per-file-ignores]
# declaration tables (one question / form field per line) and inline page CSS/JS
"src/jobhunt/bank/keys.py" = ["E501"]
"src/jobhunt/onboarding/form.py" = ["E501"]
"src/jobhunt/forms/packet.py" = ["E501"]
"tests/fixtures/forms/make_forms.py" = ["E501"]
"tests/fixtures/resumes/make_resumes.py" = ["E501"]
