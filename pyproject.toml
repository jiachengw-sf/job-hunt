[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jobhunt"
version = "0.0.1"
description = "A local-first job-hunt agent: deterministic Python core plus portable Agent Skills. The human always clicks Submit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "jobhunt contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "click>=8.1",
  "openpyxl>=3.1.5",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Needed from Milestone 4 (pre-fill). `jobhunt doctor` reports when it is missing.
browser = ["playwright>=1.45"]
# Embedding recall (sentence-transformers pulls in PyTorch, ~1-2 GB). Without it recall is BM25 only.
recall = ["sentence-transformers>=3.0"]
# Google Sheets tracker. XLSX needs nothing extra.
sheets = ["gspread>=6.0", "google-auth>=2.0"]

[project.scripts]
jobhunt = "jobhunt.cli.main:main"

[dependency-groups]
dev = [
    "gspread>=6.2.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "RUF001", "RUF002", "RUF003"]  # en dashes and curly quotes are matched on purpose
