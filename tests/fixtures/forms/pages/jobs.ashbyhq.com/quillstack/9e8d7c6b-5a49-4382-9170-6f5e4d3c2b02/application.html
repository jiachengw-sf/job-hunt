<!doctype html><html><head><meta charset="utf-8"><title>Synthetic posting</title></head><body data-upload-url="https://ashbyhq-infra-prd-main-app-uploaded-files-us-east-1.s3.us-east-1.amazonaws.com/"><div class="ashby-application-form-container"><div class="ashby-application-form-field-entry" data-field-path="_systemfield_name"><label for="_systemfield_name" class="ashby-application-form-question-title _required">Name</label><input id="_systemfield_name" name="_systemfield_name" type="text" placeholder="Type here..."></div><div class="ashby-application-form-field-entry" data-field-path="_systemfield_email"><label for="_systemfield_email" class="ashby-application-form-question-title _required">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email" placeholder="Type here..."></div><div class="ashby-application-form-field-entry" data-field-path="9e8d7c6b-phone"><label for="9e8d7c6b-phone" class="ashby-application-form-question-title">Phone</label><input id="9e8d7c6b-phone" name="9e8d7c6b-phone" type="tel" placeholder="Type here..."></div><div class="ashby-application-form-field-entry" data-field-path="_systemfield_resume"><label for="_systemfield_resume" class="ashby-application-form-question-title _required">Resume</label><input type="file" id="_systemfield_resume" accept="application/pdf,.pdf,.doc,.docx,text/plain,.txt,text/markdown,.md"><div class="fx-file-name"></div></div><div class="ashby-application-form-field-entry" data-field-path="9e8d7c6b-linkedin"><label for="9e8d7c6b-linkedin" class="ashby-application-form-question-title">LinkedIn Profile</label><input id="9e8d7c6b-linkedin" name="9e8d7c6b-linkedin" type="text" placeholder="Type here..."></div><div class="ashby-application-form-field-entry" data-field-path="9e8d7c6b-auth"><label for="9e8d7c6b-auth" class="ashby-application-form-question-title _required">Are you legally authorized to work in the United States?</label><div class="yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" name="9e8d7c6b-auth" tabindex="-1" style="display:none"></div></div><div class="ashby-application-form-field-entry" data-field-path="9e8d7c6b-spons"><label for="9e8d7c6b-spons" class="ashby-application-form-question-title _required">Will you now or in the future require visa sponsorship?</label><div class="yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" name="9e8d7c6b-spons" tabindex="-1" style="display:none"></div></div><div data-field-path="9e8d7c6b-heard"><fieldset class="ashby-application-form-field-entry"><label for="9e8d7c6b-heard" class="ashby-application-form-question-title">How did you hear about this opportunity?</label><div class="_option"><span><input type="radio" id="entry_9e8d7c6b-heard-labeled-radio-0" name="entry_9e8d7c6b-heard"></span><label for="entry_9e8d7c6b-heard-labeled-radio-0">Job board</label></div><div class="_option"><span><input type="radio" id="entry_9e8d7c6b-heard-labeled-radio-1" name="entry_9e8d7c6b-heard"></span><label for="entry_9e8d7c6b-heard-labeled-radio-1">Company website</label></div><div class="_option"><span><input type="radio" id="entry_9e8d7c6b-heard-labeled-radio-2" name="entry_9e8d7c6b-heard"></span><label for="entry_9e8d7c6b-heard-labeled-radio-2">Referral</label></div><div class="_option"><span><input type="radio" id="entry_9e8d7c6b-heard-labeled-radio-3" name="entry_9e8d7c6b-heard"></span><label for="entry_9e8d7c6b-heard-labeled-radio-3">University career center</label></div><div class="_option"><span><input type="radio" id="entry_9e8d7c6b-heard-labeled-radio-4" name="entry_9e8d7c6b-heard"></span><label for="entry_9e8d7c6b-heard-labeled-radio-4">Other</label></div></fieldset></div><div class="ashby-application-form-field-entry" data-field-path="9e8d7c6b-lic"><label for="9e8d7c6b-lic" class="ashby-application-form-question-title _required">Do you have a valid driver&#x27;s license?</label><div class="yesno"><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="yes">Yes</button><button class="ashby-application-form-input-yesno-option" aria-pressed="false" data-option="no">No</button><input type="checkbox" name="9e8d7c6b-lic" tabindex="-1" style="display:none"></div></div><div class="ashby-survey"><p>U.S. EQUAL EMPLOYMENT OPPORTUNITY INFORMATION (voluntary)</p><div data-field-path="_systemfield_eeoc_gender"><fieldset class="ashby-application-form-field-entry"><label for="_systemfield_eeoc_gender" class="ashby-application-form-question-title">Gender</label><div class="_option"><span><input type="radio" id="entry__systemfield_eeoc_gender-labeled-radio-0" name="entry__systemfield_eeoc_gender"></span><label for="entry__systemfield_eeoc_gender-labeled-radio-0">Male</label></div><div class="_option"><span><input type="radio" id="entry__systemfield_eeoc_gender-labeled-radio-1" name="entry__systemfield_eeoc_gender"></span><label for="entry__systemfield_eeoc_gender-labeled-radio-1">Female</label></div><div class="_option"><span><input type="radio" id="entry__systemfield_eeoc_gender-labeled-radio-2" name="entry__systemfield_eeoc_gender"></span><label for="entry__systemfield_eeoc_gender-labeled-radio-2">Decline to self-identify</label></div></fieldset></div><div data-field-path="_systemfield_eeoc_veteran_status"><fieldset class="ashby-application-form-field-entry"><label for="_systemfield_eeoc_veteran_status" class="ashby-application-form-question-title">Veteran Status</label><div class="_option"><span><input type="radio" id="entry__systemfield_eeoc_veteran_status-labeled-radio-0" name="entry__systemfield_eeoc_veteran_status"></span><label for="entry__systemfield_eeoc_veteran_status-labeled-radio-0">I am not a protected veteran</label></div><div class="_option"><span><input type="radio" id="entry__systemfield_eeoc_veteran_status-labeled-radio-1" name="entry__systemfield_eeoc_veteran_status"></span><label for="entry__systemfield_eeoc_veteran_status-labeled-radio-1">I decline to self-identify for protected veteran status</label></div></fieldset></div></div><button class="ashby-application-form-submit-button"><span>Submit Application</span></button><p id="fx-status"></p></div><script>// Synthetic stand-in for Ashby's hosted application form (no <form>; yes/no toggles, radio and
// checkbox groups, location combobox, upload -> parse -> autofill, GraphQL submit). Fixture only.
(function () {
  const GQL = '/api/non-user-graphql?op=';
  const post = (op, body) => fetch(GQL + op, {method: 'POST', body: JSON.stringify(body || {}),
    headers: {'content-type': 'application/json'}});

  document.querySelectorAll('button[data-option]').forEach(b => {
    b.addEventListener('click', () => {
      b.parentElement.querySelectorAll('button[data-option]').forEach(o =>
        o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
      b.parentElement.querySelector('input[type=checkbox]').checked = b.dataset.option === 'yes';
    });
  });

  document.querySelectorAll('.fx-location').forEach(entry => {
    const input = entry.querySelector('input[role=combobox]');
    const list = entry.querySelector('[role=listbox]');
    let timer = null;
    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        list.innerHTML = '';
        const text = input.value.trim().toLowerCase();
        if (text.length < 2) return;
        const r = await post('ApiAutocompleteGeoLocation', {text});
        const all = (await r.json()).data.result;
        all.filter(o => o.toLowerCase().includes(text)).forEach(o => {
          const d = document.createElement('div');
          d.setAttribute('role', 'option');
          d.textContent = o;
          d.addEventListener('click', () => { input.value = o; list.innerHTML = ''; });
          list.appendChild(d);
        });
      }, 120);
    });
  });

  const resume = document.getElementById('_systemfield_resume');
  if (resume) resume.addEventListener('change', async () => {
    const f = resume.files[0];
    const entry = resume.closest('[data-field-path]');
    entry.querySelector('.fx-file-name').textContent = 'Uploading...';
    await post('ApiCreateFileUploadHandle', {filename: f.name});
    const body = new FormData();
    body.append('file', f);
    await fetch(document.body.dataset.uploadUrl, {method: 'POST', body});
    entry.querySelector('.fx-file-name').textContent = f.name;
    const r = await post('ApiAutofillApplicationFormWithUploadedResume', {});
    const parsed = (await r.json()).data.autofill;
    // Ashby's parse lands a moment later and overwrites the fields it knows.
    setTimeout(() => {
      const set = (sel, v) => { const el = document.querySelector(sel); if (el && v) el.value = v; };
      set('#_systemfield_name', parsed.name);
      set('#_systemfield_email', parsed.email);
      set('input[type=tel]', parsed.phone);
    }, 300);
  });

  document.querySelector('.ashby-application-form-submit-button').addEventListener('click',
    async () => {
      try {
        const r = await post('ApiSubmitSingleApplicationFormAction', {});
        if (!r.ok) throw new Error('rejected');
        document.querySelector('.ashby-application-form-container').outerHTML =
          '<div class="ashby-application-form-success-container"><h2>Thank you for applying' +
          '</h2><p>Your application was successfully submitted.</p></div>';
      } catch (e) {
        document.getElementById('fx-status').textContent = 'Something went wrong.';
      }
    });
})();
</script></body></html>
