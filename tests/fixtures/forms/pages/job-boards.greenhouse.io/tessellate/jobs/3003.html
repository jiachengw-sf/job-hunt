class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div><div class="select__container" data-kind="select" data-multi="0" data-options="[&quot;Yes&quot;, &quot;No&quot;]"><label id="question_300303-label" for="question_300303" class="label select__label">Will you now or in the future require sponsorship for employment visa status (e.g., H-1B visa status)?<span aria-hidden="true">*</span></label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__input-container"><input class="select__input" id="question_300303" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="question_300303-label" aria-required="true" autocomplete="off"></div></div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div><div class="select__container" data-kind="select" data-multi="0" data-options="[&quot;Job board&quot;, &quot;Company website&quot;, &quot;Referral&quot;, &quot;University career center&quot;, &quot;Other&quot;]"><label id="question_300304-label" for="question_300304" class="label select__label">How did you hear about this job?<span aria-hidden="true">*</span></label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__input-container"><input class="select__input" id="question_300304" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="question_300304-label" aria-required="true" autocomplete="off"></div></div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div><div class="select__container" data-kind="select" data-multi="0" data-options="[&quot;Yes&quot;, &quot;No&quot;]"><label id="question_300306-label" for="question_300306" class="label select__label">Do you have a valid driver&#x27;s license?<span aria-hidden="true">*</span></label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__input-container"><input class="select__input" id="question_300306" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="question_300306-label" aria-required="true" autocomplete="off"></div></div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div><div class="select__container" data-kind="select" data-multi="0" data-options="[&quot;Yes&quot;, &quot;No&quot;]"><label id="question_300307-label" for="question_300307" class="label select__label">Will you require Tessellate to sponsor you for a work permit now or in the future for the location(s) you selected?<span aria-hidden="true">*</span></label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__input-container"><input class="select__input" id="question_300307" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="question_300307-label" aria-required="true" autocomplete="off"></div></div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div><div class="eeoc__container"><h3>Voluntary Self-Identification</h3><div class="select__container" data-kind="select" data-multi="0" data-options="[&quot;Male&quot;, &quot;Female&quot;, &quot;Decline To Self Identify&quot;]"><label id="gender-label" for="gender" class="label select__label">Gender</label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__input-container"><input class="select__input" id="gender" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="gender-label" aria-required="false" autocomplete="off"></div></div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div><div class="select__container" data-kind="select" data-multi="0" data-options="[&quot;Yes&quot;, &quot;No&quot;, &quot;Decline To Self Identify&quot;]"><label id="hispanic_ethnicity-label" for="hispanic_ethnicity" class="label select__label">Are you Hispanic/Latino?</label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__input-container"><input class="select__input" id="hispanic_ethnicity" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="hispanic_ethnicity-label" aria-required="false" autocomplete="off"></div></div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div><template id="fx-race"><div class="select__container" data-kind="select" data-multi="0" data-options="[&quot;Asian&quot;, &quot;White&quot;, &quot;Decline To Self Identify&quot;]"><label id="race-label" for="race" class="label select__label">Race</label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__input-container"><input class="select__input" id="race" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="race-label" aria-required="false" autocomplete="off"></div></div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div></template><div class="select__container" data-kind="select" data-multi="0" data-options="[&quot;I am not a protected veteran&quot;, &quot;I don&#x27;t wish to answer&quot;]"><label id="veteran_status-label" for="veteran_status" class="label select__label">VeteranStatus</label><div class="select-shell"><div class="select__control"><div class="select__value-container"><div class="select__input-container"><input class="select__input" id="veteran_status" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-labelledby="veteran_status-label" aria-required="false" autocomplete="off"></div></div><div class="select__indicators"><button type="button" class="icon-button" aria-label="Toggle flyout"></button></div></div></div></div></div><button type="submit" class="btn btn--pill">Submit application</button><p id="fx-status"></p></form></main><script type="application/json" id="fx-locations">["Northfield, Illinois, United States", "Northfield, Minnesota, United States", "Lakeview, Massachusetts, United States", "Lakeview, Oregon, United States", "Coastal Plains, Massachusetts, United States", "Granite Valley, Colorado, United States", "Granite Valley, Idaho, United States", "Springfield, Illinois, United States"]</script><script>// Synthetic stand-in for Greenhouse's job-board application form (react-select comboboxes,
// location autocomplete, phone country, S3 resume upload, JS-driven submit). Test fixture only.
(function () {
  const LOCATIONS = JSON.parse(document.getElementById('fx-locations').textContent);

  function menuFor(container) {
    let m = container.querySelector('.select__menu');
    if (!m) {
      m = document.createElement('div');
      m.className = 'select__menu';
      m.setAttribute('role', 'listbox');
      container.querySelector('.select-shell').appendChild(m);
    }
    return m;
  }
  function close(container) {
    const m = container.querySelector('.select__menu');
    if (m) m.remove();
    const input = container.querySelector('input[role=combobox]');
    input.setAttribute('aria-expanded', 'false');
    input.value = '';
  }
  function options(container, text) {
    const t = text.trim().toLowerCase();
    if (container.dataset.kind === 'location') {
      if (t.length < 2) return [];
      return LOCATIONS.filter(o => o.toLowerCase().includes(t));
    }
    const all = JSON.parse(container.dataset.options);
    return all.filter(o => o.toLowerCase().includes(t));
  }
  function render(container) {
    const input = container.querySelector('input[role=combobox]');
    const id = input.id;
    const m = menuFor(container);
    m.innerHTML = '';
    input.setAttribute('aria-expanded', 'true');
    options(container, input.value).forEach((o, i) => {
      const d = document.createElement('div');
      d.className = 'select__option';
      d.setAttribute('role', 'option');
      d.id = 'react-select-' + id + '-option-' + i;
      d.textContent = o;
      d.addEventListener('click', () => choose(container, o));
      m.appendChild(d);
    });
  }
  function choose(container, text) {
    const vc = container.querySelector('.select__value-container');
    if (container.dataset.multi === '1') {
      const mv = document.createElement('div');
      mv.className = 'select__multi-value';
      mv.innerHTML = '<div class="select__multi-value__label"></div>';
      mv.firstChild.textContent = text;
      vc.insertBefore(mv, vc.querySelector('.select__input-container'));
    } else {
      let sv = vc.querySelector('.select__single-value');
      if (!sv) {
        sv = document.createElement('div');
        sv.className = 'select__single-value';
        vc.insertBefore(sv, vc.querySelector('.select__input-container'));
      }
      sv.textContent = text;
      if (container.dataset.kind === 'phone-country') {
        const name = text.replace(/\s*\+\d+$/, '');
        document.querySelector('.iti__selected-country').setAttribute('title', name);
      }
    }
    close(container);
    if (container.querySelector('input[role=combobox]').id === 'hispanic_ethnicity') {
      revealRace(container, text === 'No');
    }
  }
  // Race exists only once Hispanic/Latino is answered No, as on the live page.
  function revealRace(hisp, show) {
    const race = document.getElementById('race');
    if (race && !show) race.closest('.select__container').remove();
    if (!race && show) {
      const tpl = document.getElementById('fx-race');
      hisp.insertAdjacentElement('afterend', tpl.content.firstElementChild.cloneNode(true));
      bind(hisp.nextElementSibling);
    }
  }
  function bind(c) {
    const input = c.querySelector('input[role=combobox]');
    input.addEventListener('click', () => render(c));
    input.addEventListener('focus', () => render(c));
    input.addEventListener('input', () => {
      if (c.dataset.kind === 'location') setTimeout(() => render(c), 150);
      else render(c);
    });
    input.addEventListener('keydown', e => { if (e.key === 'Escape') close(c); });
  }
  document.querySelectorAll('.select__container').forEach(bind);
  document.addEventListener('mousedown', e => {
    document.querySelectorAll('.select__container').forEach(c => {
      if (!c.contains(e.target)) close(c);
    });
  });

  document.querySelectorAll('.file-upload input[type=file]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const f = inp.files[0];
      const body = new FormData();
      body.append('file', f);
      const wrap = inp.closest('.file-upload').querySelector('.file-upload__wrapper');
      try {
        const r = await fetch(document.body.dataset.uploadUrl, {method: 'POST', body});
        if (!r.ok) throw new Error('upload failed');
        wrap.innerHTML = '<div class="file-upload__filename"></div>' +
          '<button type="button" class="btn btn--pill">Remove</button>';
        wrap.firstChild.textContent = f.name;
      } catch (e) {
        wrap.insertAdjacentHTML('beforeend', '<p class="error">Upload failed</p>');
      }
    });
  });

  document.getElementById('application-form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const r = await fetch(location.pathname, {method: 'POST', body: new FormData(e.target)});
      if (!r.ok) throw new Error('rejected');
      location.href = location.pathname + '?application_id=4242001';
    } catch (err) {
      document.getElementById('fx-status').textContent = 'There was a problem submitting.';
    }
  });
})();
</script></body></html>
