# Canonical question key -> known wordings of that question on real application forms.
# A label whose normalized text equals one of these wordings maps to the key without asking.
# Anything merely similar is only a *candidate*: the user confirms it once (`jobhunt answers
# confirm`), and the confirmed wording is saved to answers.yaml. Never add a wording whose answer
# could differ from the key's (e.g. "now" vs "in the future" for sponsorship).
# The job's company name is replaced by "company" before matching ("worked at Acme" -> "worked
# at company").

