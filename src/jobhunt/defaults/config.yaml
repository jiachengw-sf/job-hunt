# jobhunt system defaults. Do not edit this file in the installed package:
# put overrides in ~/.jobhunt/config.yaml (only the keys you want to change).
version: 1

tracker:
  kind: xlsx            # xlsx | sheets | none
  xlsx_path: null      # default: tracker.xlsx inside your jobhunt data directory
  sheets:
    spreadsheet_id: null
    service_account_file: null
  include_gated_out: false   # also list jobs that failed a Must gate (with the reason)

http:
  # Sent on every request. Add a way to reach you if you like (it stays in your config file).
  user_agent: "jobhunt/{version} (open-source personal job-search tool; respects robots and rate limits)"
  min_host_interval_seconds: 1.0
  timeout_seconds: 20
  max_retries: 4

discovery:
  simplify:
    enabled: true
    branch: dev
    internship_repo: Summer2027-Internships   # chosen when preferences seek internships / co-ops
    new_grad_repo: New-Grad-Positions         # chosen when preferences seek new-grad / entry roles
  old_posting_days: 60       # signal: posting date older than this
  repost_max_distance: 3     # signal: SimHash bits that may differ for a repost
  empty_run_warn_after: 3    # warn when a source returns nothing this many runs in a row

schedule:
  interval_hours: 4     # recruiting-season default; new postings matter most in their first 48-96h

fit:
  recall_top_k: 50           # jobs kept after recall (watchlist companies always kept)
  priority_threshold: 0.5    # jobs at or above this get application forms inspected (Milestone 3)
  use_embeddings: auto       # auto | off. auto uses sentence-transformers if the [recall] extra is installed
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  level_mismatch_years: 3    # role wants this many more years than you have -> band at most stretch
  yoe_gate_slack_years: 2    # role wants more than this many extra years -> fails the experience gate
  freshness_half_life_days: 7
  # The weights below are visible on purpose. `jobhunt calibrate` (Milestone 6) suggests changes;
  # nothing tunes itself.
  bands: {strong: 0.8, good: 0.6, stretch: 0.3}
  qualification:
    must_share: 0.75         # share of the qualification score from must-haves (rest: preferred)
    met_stated: 1.0
    met_inferred: 0.6
    partial: 0.5
    unassessed: 0.4          # not judged yet (band stays provisional)
    unmet: 0.0
  priority:                  # relevance = recall rank (used to rank, never shown as fit)
    {band: 0.35, relevance: 0.15, preference: 0.15, freshness: 0.10, deadline: 0.10, referral: 0.10, watchlist: 0.05}
  preference: {pay: 0.30, location: 0.20, work_mode: 0.15, term: 0.10, keywords: 0.15, industry: 0.10}

volume_guard:
  max_applications_per_company: 2   # warn before the next one
  window_days: 90

forms:
  max_per_run: 30            # application forms `jobhunt run` inspects (top priorities first; 0 = off)
  spec_max_age_days: 7       # re-read a cached form after this many days
  ashby_browser: true        # Ashby forms load in a headless browser (read-only; needs the [browser] extra)
  candidate_threshold: 0.6   # label similarity that suggests a known question (the user confirms once)

prefill:
  batch_size: 5              # tabs filled per batch
  browser: auto              # auto | chrome | chromium (auto: real Chrome if installed)
  parse_wait_s: 20           # wait this long for an ATS to parse an uploaded resume (Ashby, Lever)
  watch_hours: 6             # how long open tabs are watched for your submission

followups:
  after_days: 7
  max_per_application: 2

research:
  cache_days: 14
  max_searches: 5
  max_fetches: 8

notifications:
  ntfy_topic: null
  discord_webhook: null
  smtp: null

writing_style_skill: null   # name of a personal writing-style skill to hand essay drafting to
