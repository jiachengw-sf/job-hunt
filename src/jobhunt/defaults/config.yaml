# jobhunt system defaults. Do not edit this file in the installed package:
# put overrides in ~/.jobhunt/config.yaml (only the keys you want to change).
version: 1

tracker:
  kind: xlsx            # xlsx | sheets | none
  xlsx_path: null      # default: tracker.xlsx inside your jobhunt data directory
  sheets:
    spreadsheet_id: null
    service_account_file: null
  include_gated_out: false   # also list jobs that failed a Must gate (with the reason)
  max_jobs: 200              # top matches in the Jobs tab by rank (0 = every match); jobs you acted on always appear

http:
  # Sent on every request. Add a way to reach you if you like (it stays in your config file).
  user_agent: "jobhunt/{version} (open-source personal job-search tool; respects robots and rate limits)"
  min_host_interval_seconds: 1.0
  timeout_seconds: 20
  max_retries: 4

discovery:
  simplify:
    enabled: true
    branch: dev
    internship_repo: Summer2027-Internships   # chosen when preferences seek internships / co-ops
    new_grad_repo: New-Grad-Positions         # chosen when preferences seek new-grad / entry roles
  old_posting_days: 60       # signal: posting date older than this
  repost_max_distance: 3     # signal: SimHash bits that may differ for a repost
  empty_run_warn_after: 3    # warn when a source returns nothing this many runs in a row

schedule:
  interval_hours: 4     # recruiting-season default; new postings matter most in their first 48-96h

fit:
  # Ranking: jobs sort on a fixed order of keys, not one blended score.
  #   1. tier: strong / possible / weak match (role match + relevance, below)
  #   2. how many of your Nice preferences the job meets (more first)
  #   3. date: an upcoming application deadline (internships), a recent posting date (newest
  #      first), an unknown date (none given, or an always-open post), then a stale date
  tiers:
    # Relevance = the job's search score against your resume over the best score this run
    # (0-1). Chosen on `jobhunt eval-fit` (evals/fit, 4 personas, one row per distinct title):
    # strong = the value with the most grade-2 jobs among strong while keeping >= 90% of them;
    # possible = the value with the fewest errors, a plausible job left weak counting double.
    # Only 11 grade-2 jobs decide `strong`: leaving one persona out moves it 0.25-0.48, and
    # `possible` 0.09-0.18. Re-check both when the eval set grows.
    strong: 0.5              # needs a role match (defaults/role_families.yaml) and posting text
    possible: 0.15           # with no role match: below this, or a title sharing no word with
                             # your resume, roles or keywords, a job is a weak match
  ready_tier: strong         # jobs this good or better get forms read and judged first
  hide_weak: false           # true: weak matches stay out of `jobs`, the sheet and the digest
  stale_after_days: 30       # a posting date older than this sorts after unknown dates
  min_text_words: 3          # fewer description words than this: "title only" (at most possible)
  recall_top_k: 50           # top recalled jobs get judgment tasks and posting reads (watchlist always)
  recall_description_tokens: 150  # description words recall reads per job, after the title
  describe_top_k: 20         # top recalled jobs with no posting text (e.g. Simplify rows): `run` reads it from the ATS
  judge_top_k: 10            # top recalled jobs (by relevance) that get a judgment task even outside ready_tier
  use_embeddings: auto       # auto | off. auto uses sentence-transformers if the [recall] extra is installed
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  level_mismatch_years: 3    # role wants this many more years than you have -> band at most stretch
  yoe_gate_slack_years: 2    # role wants more than this many extra years -> fails the experience gate
  # The weights below are visible on purpose. `jobhunt calibrate` suggests changes;
  # nothing tunes itself.
  bands: {strong: 0.8, good: 0.6, stretch: 0.3}
  qualification:
    must_share: 0.75         # share of the qualification score from must-haves (rest: preferred)
    met_stated: 1.0
    met_inferred: 0.6
    partial: 0.5
    unassessed: 0.4          # not judged yet (band stays provisional)
    unmet: 0.0
  # The preference score (shown by `jobhunt show`, not used to rank): weights per Nice preference.
  preference: {pay: 0.30, location: 0.20, work_mode: 0.15, term: 0.10, keywords: 0.15, industry: 0.10}

volume_guard:
  max_applications_per_company: 2   # warn before the next one
  window_days: 90

forms:
  max_per_run: 30            # application forms `jobhunt run` inspects (top priorities first; 0 = off, posting-text reads too)
  spec_max_age_days: 7       # re-read a cached form after this many days
  ashby_browser: true        # Ashby forms load in a headless browser (read-only; needs the [browser] extra)
  candidate_threshold: 0.6   # label similarity that suggests a known question
  fill_similar: true         # fill a clearly similar question from your known answer, flagged for review before Submit (false: ask first)

prefill:
  batch_size: 5              # tabs filled per batch
  browser: auto              # auto | chrome | chromium (auto: real Chrome if installed)
  parse_wait_s: 20           # wait this long for an ATS to parse an uploaded resume (Ashby, Lever)
  watch_hours: 6             # how long open tabs are watched for your submission

followups:
  after_days: 7
  max_per_application: 2

tracking:                    # application records, the dashboard and APPLICATIONS.md
  timezone: null               # e.g. America/Los_Angeles; null = this computer's time zone
  stale_after_days: 21         # days in Applied with no update before views say "likely no response"
  open_dashboard: true         # `jobhunt dashboard` opens the page in your browser

research:
  cache_days: 14
  max_searches: 5
  max_fetches: 8

drafts:
  unchanged_edit_ratio: 0.05   # approving an essay you changed less than this gets a gentle nudge
  outreach_max_chars: 600      # referral, coffee-chat and follow-up drafts stay short

notifications:               # the terminal digest is always on: `jobhunt digest`
  ntfy_topic: null             # ntfy.sh topic (pick a long random name), or your own server's URL
  discord_webhook: null        # a webhook URL for a private channel
  smtp: null                   # {host, port, username, password_env, to}: email to yourself
  digest: daily                # every_run | daily | off: when `jobhunt run` pushes the digest
  alerts: true                 # push new matches right away
  alert_tier: strong           # strong | possible | weak: new matches this good or better alert

calibration:                 # `jobhunt calibrate` only reports and suggests; nothing tunes itself
  min_responses: 5             # replies a band needs before it gets a label (no reply never counts)
  flat_margin: 0.05            # interview rates closer than this are "flat"
  skip_min: 3                  # skips with one reason before it drives a suggestion
  skip_share: 0.3              # ...and that reason's share of strong/good skips
  step: 0.05                   # size of a suggested threshold or weight change

writing_style_skill: null   # name of a personal writing-style skill to hand essay drafting to
