# jobhunt system defaults. Do not edit this file in the installed package:
# put overrides in ~/.jobhunt/config.yaml (only the keys you want to change).
version: 1

tracker:
  kind: xlsx            # xlsx | sheets | none
  xlsx_path: null      # default: tracker.xlsx inside your jobhunt data directory
  sheets:
    spreadsheet_id: null
    service_account_file: null

http:
  # Sent on every request. Add a way to reach you if you like (it stays in your config file).
  user_agent: "jobhunt/{version} (open-source personal job-search tool; respects robots and rate limits)"
  min_host_interval_seconds: 1.0
  timeout_seconds: 20
  max_retries: 4

discovery:
  simplify:
    enabled: true
    branch: dev
    internship_repo: Summer2027-Internships   # chosen when preferences seek internships / co-ops
    new_grad_repo: New-Grad-Positions         # chosen when preferences seek new-grad / entry roles
  old_posting_days: 60       # signal: posting date older than this
  repost_max_distance: 3     # signal: SimHash bits that may differ for a repost
  empty_run_warn_after: 3    # warn when a source returns nothing this many runs in a row

schedule:
  interval_hours: 4     # recruiting-season default; new postings matter most in their first 48-96h

fit:
  recall_top_k: 50
  priority_threshold: 0.5

volume_guard:
  max_applications_per_company: 2   # warn before the next one
  window_days: 90

prefill:
  batch_size: 5

followups:
  after_days: 7
  max_per_application: 2

research:
  cache_days: 14
  max_searches: 5
  max_fetches: 8

notifications:
  ntfy_topic: null
  discord_webhook: null
  smtp: null

writing_style_skill: null   # name of a personal writing-style skill to hand essay drafting to
